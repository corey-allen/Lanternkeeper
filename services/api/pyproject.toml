[project]
name = "lanternkeeper-api"
version = "0.1.0"
description = "Lanternkeeper API service and ingestion worker."
requires-python = ">=3.12"
dependencies = [
    "lanternkeeper-rules",
    "lanternkeeper-dm",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pymupdf>=1.24",
    "python-multipart>=0.0.12",
]

[project.scripts]
lanternkeeper-worker = "lk_api.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lk_api"]

[tool.uv.sources]
lanternkeeper-rules = { workspace = true }
lanternkeeper-dm = { workspace = true }
