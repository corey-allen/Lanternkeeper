[project]
name = "lanternkeeper-dm"
version = "0.1.0"
description = "Provider-neutral AI orchestration primitives for Lanternkeeper (no database access)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lk_dm"]
