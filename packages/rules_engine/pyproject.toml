[project]
name = "lanternkeeper-rules"
version = "0.1.0"
description = "Deterministic, framework-independent rules engine for Lanternkeeper."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lk_rules"]
